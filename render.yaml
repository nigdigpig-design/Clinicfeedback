services:
  - type: web
    name: clinic-feedback-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: clinic-feedback-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

  - type: static
    name: clinic-feedback-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    publishPath: build
    envVars:
      - key: REACT_APP_API_URL
        value: https://clinic-feedback-backend.onrender.com

  - type: postgresql
    name: clinic-feedback-db
    plan: free