services:
  # Бэкенд (Node.js)
  - type: web
    name: clinic-feedback-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: clinic-feedback-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

  # Фронтенд (статический сайт, но через тип web + static)
  - type: web
    name: clinic-feedback-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: build
    envVars:
      - key: REACT_APP_API_URL
        value: https://clinic-feedback-backend.onrender.com

  # База данных (PostgreSQL)
  - type: postgresql
    name: clinic-feedback-db
    database: clinic_feedback
    plan: free