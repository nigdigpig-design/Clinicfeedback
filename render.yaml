# Секция для баз данных Render Postgres
databases:
  - name: clinic-feedback-db   # Имя базы данных
    databaseName: clinic_feedback  # Имя базы данных внутри Postgres
    user: clinic_feedback_user     # Пользователь базы данных
    plan: free                     # Бесплатный тариф (до 256 МБ)

# Секция для всех сервисов
services:
  # 1. Backend (Node.js сервер)
  -services:
  - type: web
    name: clinic-feedback-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false

  # 2. Frontend (React статический сайт)
  - type: web
    name: clinic-feedback-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: build
    envVars:
      # Адрес backend'а для запросов из React
      - key: REACT_APP_API_URL
        value: https://clinic-feedback-backend.onrender.com/api